<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Visa Application - Govind Tours</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#e2d7e0",
              "on-tertiary": "#ffffff",
              "on-tertiary-container": "#d5e7ff",
              "on-primary": "#ffffff",
              "on-background": "#1f1a20",
              "tertiary": "#055285",
              "surface-container-high": "#f1e5ef",
              "inverse-surface": "#352e36",
              "primary": "#a10017",
              "on-secondary": "#ffffff",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "secondary-container": "#6faafe",
              "tertiary-fixed-dim": "#9bcbff",
              "surface-tint": "#ba1823",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#f9edf7",
              "secondary-fixed": "#d5e3ff",
              "on-secondary-fixed-variant": "#004787",
              "surface": "#fff7fb",
              "on-primary-container": "#ffddda",
              "surface-container-highest": "#ebdfe9",
              "secondary": "#0f5fae",
              "secondary-fixed-dim": "#a7c8ff",
              "on-surface-variant": "#5b403e",
              "inverse-primary": "#ffb3ae",
              "tertiary-container": "#2e6a9e",
              "surface-bright": "#fff7fb",
              "primary-fixed": "#ffdad7",
              "primary-container": "#c6222a",
              "primary-fixed-dim": "#ffb3ae",
              "outline": "#8f6f6d",
              "outline-variant": "#e4beba",
              "on-tertiary-fixed": "#001d34",
              "error": "#ba1a1a",
              "on-primary-fixed": "#410004",
              "tertiary-fixed": "#d0e4ff",
              "background": "#fff7fb",
              "on-secondary-container": "#003d77",
              "on-primary-fixed-variant": "#930014",
              "surface-container-low": "#fcf0fa",
              "on-error-container": "#93000a",
              "surface-container": "#f6eaf4",
              "on-surface": "#1f1a20",
              "on-secondary-fixed": "#001c3b",
              "surface-variant": "#ebdfe9",
              "on-tertiary-fixed-variant": "#004a79"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .editorial-shadow {
            box-shadow: 0 20px 40px -12px rgba(31, 26, 32, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-stone-900/80 backdrop-blur-xl shadow-sm dark:shadow-none flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-red-700 dark:text-red-500 active:scale-95 duration-200 transition-colors hover:bg-stone-100 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-plus-jakarta font-bold text-lg tracking-tight text-on-surface">Visa Application</h1>
</div>
<div class="style_brand_logo text-red-700 dark:text-red-500 font-bold font-headline">Govind Tours</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-3xl mx-auto">
<!-- Step Indicator -->
<div class="mb-12">
<div class="flex items-center justify-between mb-4">
<div class="flex flex-col items-center gap-2 group">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold editorial-shadow">1</div>
<span class="text-[11px] font-headline font-bold uppercase tracking-widest text-primary">Personal</span>
</div>
<div class="h-[2px] flex-1 mx-4 bg-primary-fixed"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">2</div>
<span class="text-[11px] font-headline font-semibold uppercase tracking-widest text-on-surface-variant">Passport</span>
</div>
<div class="h-[2px] flex-1 mx-4 bg-surface-container-highest"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">3</div>
<span class="text-[11px] font-headline font-semibold uppercase tracking-widest text-on-surface-variant">Travel</span>
</div>
</div>
<p class="text-sm text-center text-outline font-medium">Step 1 of 3: Personal Information</p>
</div>
<!-- Form Container -->
<div class="space-y-10">
<!-- Section 1: Personal Information -->
<section class="bg-surface-container-low rounded-xl p-6 md:p-8 relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
<h2 class="font-headline font-bold text-xl mb-8 flex items-center gap-3">
<span class="w-1 h-6 bg-primary rounded-full"></span>
                    Personal Information
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2 col-span-full">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Full Name</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant text-on-surface" placeholder="Enter your full legal name" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Date of Birth</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" type="date"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Gender</label>
<select class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface">
<option value="">Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Email Address</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant text-on-surface" placeholder="example@domain.com" type="email"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Phone Number</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-2 border-error/20 focus:ring-1 focus:ring-error transition-all placeholder:text-outline-variant text-on-surface" placeholder="+1 (555) 000-0000" type="tel"/>
<p class="text-xs text-error mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                            Please provide a valid contact number
                        </p>
</div>
</div>
</section>
<!-- Section 2: Passport Details -->
<section class="bg-surface-container-low rounded-xl p-6 md:p-8">
<h2 class="font-headline font-bold text-xl mb-8 flex items-center gap-3 text-on-surface-variant">
<span class="w-1 h-6 bg-outline-variant rounded-full"></span>
                    Passport Details
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Passport Number</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" placeholder="L1234567" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Place of Issue</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" placeholder="City, Country" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Date of Issue</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" type="date"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Date of Expiry</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" type="date"/>
</div>
</div>
</section>
<!-- Section 3: Travel Details -->
<section class="bg-surface-container-low rounded-xl p-6 md:p-8">
<h2 class="font-headline font-bold text-xl mb-8 flex items-center gap-3 text-on-surface-variant">
<span class="w-1 h-6 bg-outline-variant rounded-full"></span>
                    Travel Details
                </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2 col-span-full">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Intended Destination</label>
<select class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface">
<option value="">Choose a country</option>
<option value="france">France (Schengen)</option>
<option value="usa">United States of America</option>
<option value="uk">United Kingdom</option>
<option value="japan">Japan</option>
<option value="australia">Australia</option>
</select>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Departure Date</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" type="date"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Return Date</label>
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface" type="date"/>
</div>
<div class="space-y-2 col-span-full">
<label class="block text-sm font-semibold text-on-surface-variant ml-1">Purpose of Visit</label>
<textarea class="w-full px-5 py-4 bg-surface-container-lowest border-none rounded-xl focus:ring-1 focus:ring-primary transition-all text-on-surface resize-none" placeholder="Describe the reason for your travel (e.g., Leisure, Business, Family Visit)" rows="3"></textarea>
</div>
</div>
</section>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl font-headline font-bold text-sm tracking-[0.05em] uppercase shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Submit Application
                    <span class="material-symbols-outlined">send</span>
</button>
<p class="text-xs text-center text-outline mt-4 px-8">
                    By submitting, you agree to Govind Tours' Data Processing Policy for Visa Applications.
                </p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-white/90 dark:bg-stone-900/90 backdrop-blur-lg shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
<button class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 scale-100 transition-colors tap-highlight-transparent hover:text-red-600">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Explore</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 scale-100 transition-colors tap-highlight-transparent hover:text-red-600">
<span class="material-symbols-outlined" data-icon="event_available">event_available</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Bookings</span>
</button>
<button class="flex flex-col items-center justify-center text-red-700 dark:text-red-400 font-bold scale-110 transition-transform tap-highlight-transparent">
<span class="material-symbols-outlined" data-icon="description" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Visas</span>
</button>
<button class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 scale-100 transition-colors tap-highlight-transparent hover:text-red-600">
<span class="material-symbols-outlined" data-icon="person_outline">person_outline</span>
<span class="font-inter text-[10px] font-medium tracking-wide uppercase mt-1">Profile</span>
</button>
</nav>
</body></html>
