<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Currency Converter - Govind Tours</title>

                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-xl shadow-sm shadow-zinc-200/50 dark:shadow-none">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button class="hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#c6222a] dark:text-[#ef4444]">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-zinc-900 dark:text-white font-['Plus_Jakarta_Sans'] font-bold tracking-tight">Currency Converter</h1>
</div>
<button class="hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined text-zinc-500 dark:text-zinc-400">settings</span>
</button>
</div>
</header>
<main class="pt-24 px-6 max-w-lg mx-auto">
<!-- Hero Section -->
<section class="mb-10 relative overflow-hidden rounded-3xl bg-secondary-container/20 h-40 flex items-center justify-between px-8">
<div class="z-10">
<h2 class="text-secondary font-headline text-2xl font-extrabold tracking-tight">Global Finance</h2>
<p class="text-on-surface-variant text-sm mt-1 max-w-[180px]">Manage your travel budget with real-time accuracy.</p>
</div>
<div class="absolute right-0 top-0 h-full w-1/2">
<img alt="Global travel and currency abstract" class="h-full w-full object-cover opacity-80 mix-blend-multiply" data-alt="Abstract 3D illustration of golden coins and a stylized globe with soft studio lighting and a clean white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_oglitsiKdu1tttf7sPxcnvvaQTwv3-2a7vV0DdrJCnmU2wtFo7xU_0SYTFWbbenEkmGKYevB_Va1-B4e8IVE69L3nkgqpeIVc2HK-m5H8fbSNWFwezq-iXhmKTvWVv6DKaRCd4VgxCAKkDE0CZk8m3cBaAX9zZo3RZkYkq4iOdzSiTbsHOJ3bkddxYV7MvMExTeGmfbm9XMbKHKbWOEiK4Q7DN7U77-eMTVPa_LNINNCUs_RrerZVGdnwuDM75D9erSQxWfGZ9E"/>
</div>
</section>
<!-- Conversion Card -->
<div class="bg-surface-container-lowest p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8">
<div class="space-y-6">
<!-- Amount Field -->
<div>
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-1">Amount</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-medium">$</span>
<input class="w-full pl-10 pr-4 py-4 bg-surface-container-high rounded-2xl border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all text-lg font-bold text-on-surface" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Currency Selection Cluster -->
<div class="flex flex-col gap-4">
<!-- From -->
<div>
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-1">From Currency</label>
<div class="relative">
<input class="w-full px-4 py-4 bg-surface-container-high rounded-2xl border-none focus:ring-0 text-on-surface cursor-pointer" readonly="" type="text" value="USD - US Dollar"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary">search</span>
</div>
</div>
<!-- Swap Button -->
<div class="flex justify-center -my-2 relative z-10">
<button class="bg-primary text-on-primary w-12 h-12 rounded-full shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined">swap_vert</span>
</button>
</div>
<!-- To -->
<div>
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-1">To Currency</label>
<div class="relative">
<select class="w-full px-4 py-4 bg-surface-container-high rounded-2xl border-none focus:ring-2 focus:ring-primary/20 appearance-none text-on-surface font-medium cursor-pointer">
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - British Pound</option>
<option selected="" value="INR">INR - Indian Rupee</option>
<option value="AED">AED - UAE Dirham</option>
<option value="JPY">JPY - Japanese Yen</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-secondary">expand_more</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-white rounded-2xl font-headline font-extrabold text-sm tracking-[0.1em] uppercase shadow-xl shadow-primary/20 hover:shadow-primary/30 transition-all active:scale-[0.98]">
                    Convert
                </button>
</div>
</div>
<!-- Result Placeholder (Content placeholder for logic) -->
<div class="bg-secondary-container/10 border-2 border-dashed border-secondary-container rounded-3xl p-8 text-center">
<p class="text-on-surface-variant text-sm font-medium">Conversion Results will appear here</p>
</div>
<!-- Market Info -->
<footer class="mt-12 mb-20 text-center">
<div class="flex items-center justify-center gap-2 text-on-surface-variant/60 mb-2">
<span class="material-symbols-outlined text-sm">schedule</span>
<span class="text-xs font-medium">Last updated: 14:30 GMT</span>
</div>
<p class="text-[10px] text-on-surface-variant/40 italic uppercase tracking-wider">Exchange rates are indicative only</p>
</footer>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full bg-white/90 dark:bg-zinc-950/90 backdrop-blur-xl flex justify-around items-center px-4 py-3 pb-safe z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] border-t border-zinc-100 dark:border-zinc-800">
<!-- Explore -->
<a class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-all cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined">explore</span>
<span class="text-[10px] font-['Plus_Jakarta_Sans'] font-semibold tracking-wide uppercase mt-1">Explore</span>
</a>
<!-- Bookings -->
<a class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-all cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined">event_available</span>
<span class="text-[10px] font-['Plus_Jakarta_Sans'] font-semibold tracking-wide uppercase mt-1">Bookings</span>
</a>
<!-- Convert (Active) -->
<a class="flex flex-col items-center justify-center text-[#c6222a] dark:text-[#ef4444] bg-[#c6222a]/5 rounded-xl px-3 py-1 transition-all cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">currency_exchange</span>
<span class="text-[10px] font-['Plus_Jakarta_Sans'] font-semibold tracking-wide uppercase mt-1">Convert</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-all cubic-bezier(0.4,0,0.2,1)" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-['Plus_Jakarta_Sans'] font-semibold tracking-wide uppercase mt-1">Profile</span>
</a>
</nav>
</body></html>
